services:
  postgres:
    image: postgres:18.4-trixie
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data/pgdata
    env_file: .env.postgres
    environment:
      POSTGRES_DB: test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "500k"
        max-file: "3"

  bot:
    build:
      context: .
      args:
        SERVICE_NAME: bot
    command: python -u -m bot.bot
    volumes:
      - ${DATA_DIR}/telegram-bot-api:/var/lib/telegram-bot-api
      - ${DATA_DIR}:/usr/src/app/${DATA_DIR}

  clean_orders_queue:
    build:
      context: .
      args:
        SERVICE_NAME: clean_orders_queue
    command: python -u -m tasks.clean_orders_queue
    volumes:
      - ${DATA_DIR}:/usr/src/app/${DATA_DIR}

  build_worker:
    build:
      context: .
      args:
        SERVICE_NAME: build_worker
    runtime: sysbox-runc
    init: true
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}:/usr/src/app/${DATA_DIR}
      - build_worker_docker_data:/var/lib/docker
    command: /bin/sh scripts/start_build_worker.sh

  workers_controller:
    build:
      context: .
      args:
        SERVICE_NAME: workers_controller
    command: gunicorn -b 0.0.0.0:8000 web.workers_controller:app
    stop_grace_period: 3m
    volumes:
      - ${DATA_DIR}:/usr/src/app/${DATA_DIR}
    ports:
      - "127.0.0.1:8000:8000"

  migrations:
    build:
      context: .
      args:
        SERVICE_NAME: migrations
    command: alembic upgrade head

  tests:
    build:
      context: .
      args:
        SERVICE_NAME: tests
    command: pytest tests/

  tg_bot_api:
    image: aiogram/telegram-bot-api:9.6
    env_file: .env.tg_bot_api
    environment:
      TELEGRAM_LOCAL: 1
    volumes:
      - ${DATA_DIR}/telegram-bot-api:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"

volumes:
  build_worker_docker_data:
